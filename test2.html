<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Document</title>
  <style>
    * {
      box-sizing: border-box;
    }

    .content-wrapper {
      width: 880px;
      padding: 32px 24px;
      background-color: #f7f9fe;
      height: 168px;
      overflow-x: overlay;
      overflow-y: hidden;
    }

    .content-inner {
      width: 900px;
      padding-left: 8px;
      padding-right: 8px;
      height: 74px;
      border: 1px solid #afb5be;
      background-color: #fff;
    }
  </style>
</head>

<body>
  <div class="content-wrapper">
    <div class="content-inner"></div>
  </div>
</body>

</html>
